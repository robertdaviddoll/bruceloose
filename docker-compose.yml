services:
  bruce-loose:
    build: .
    image: bruce-loose
    container_name: bruce-loose
    ports:
      - "${GAME_PORT:-8080}:80"   # set GAME_PORT in .env (default 8080)
    depends_on:
      - api
    restart: unless-stopped

  api:
    build: ./server
    image: bruce-loose-api
    container_name: bruce-loose-api
    environment:
      DB_PATH: /data/scores.db
      SAVES_PER_MINUTE: ${SAVES_PER_MINUTE:-6}
    volumes:
      - scores:/data   # SQLite database lives here and survives rebuilds
    restart: unless-stopped

volumes:
  scores:
